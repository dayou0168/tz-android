name: TZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/bootstrap-tz-android
      - main
    tags:
      - "1.0.7"

permissions:
  contents: write

concurrency:
  group: tz-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ_ANDROID_API_ID: ${{ secrets.TZ_ANDROID_API_ID }}
      TZ_ANDROID_API_HASH: ${{ secrets.TZ_ANDROID_API_HASH }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TZ_ANDROID_API_ID" || { echo "TZ_ANDROID_API_ID is missing"; exit 1; }
          test -n "$TZ_ANDROID_API_HASH" || { echo "TZ_ANDROID_API_HASH is missing"; exit 1; }
          echo "::add-mask::$TZ_ANDROID_API_ID"
          echo "::add-mask::$TZ_ANDROID_API_HASH"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Verify pinned TZ source configuration
        run: python3 scripts/tz_android_verify_source.py

      - name: Render private API credentials
        run: python3 scripts/tz_android_render_build_vars.py

      - name: Build no-Google release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -PTZ_NO_GOOGLE=true \
            --no-daemon \
            --stacktrace

      - name: Collect APK and provenance
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tz-android-apk"
          mkdir -p "$output"
          apk="$(find TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -p "$apk" 'lib/*/libtmessages*.so' | strings > "$RUNNER_TEMP/tz-native-strings.txt"
          grep -Fq 'tztg.tianze8.cc' "$RUNNER_TEMP/tz-native-strings.txt"
          grep -Fq 'MIIBCgKCAQEA7lyx4eQO/cyY9icmLgUQ2nxZ++xP+q1AQEfCRSvilbS72Qvyj/dJ' "$RUNNER_TEMP/tz-native-strings.txt"
          cp "$apk" "$output/TZ-Android-1.0.7.apk"
          cp TZ_ANDROID_UPSTREAM.lock "$output/"
          (cd "$output" && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TZ-Android-1.0.7-no-google
          path: ${{ runner.temp }}/tz-android-apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/tz-android-apk/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TZ Android 1.0.7" \
            --notes "TZ Android 1.0.7：修复普通 MTProto 直连只接受数字 IP、无法解析 tztg.tianze8.cc 的问题；继续固定使用 DC2、TCP 端口 2398、gramsrv RSA、tz:// 邀请链接、Full LTO 和无 Google 服务构建。"
