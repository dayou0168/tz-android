name: TZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/bootstrap-tz-android
      - main
    tags:
      - "1.0.10"

permissions:
  contents: write

concurrency:
  group: tz-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ_ANDROID_API_ID: ${{ secrets.TZ_ANDROID_API_ID }}
      TZ_ANDROID_API_HASH: ${{ secrets.TZ_ANDROID_API_HASH }}
      TZ_ANDROID_KEYSTORE_BASE64: ${{ secrets.TZ_ANDROID_KEYSTORE_BASE64 }}
      TZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TZ_ANDROID_KEYSTORE_PASSWORD }}
      TZ_ANDROID_KEY_ALIAS: ${{ secrets.TZ_ANDROID_KEY_ALIAS }}
      TZ_ANDROID_KEY_PASSWORD: ${{ secrets.TZ_ANDROID_KEY_PASSWORD }}
      TZ_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.TZ_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      TZ_ANDROID_KEYSTORE_SHA256: a2c539a25f5a52c13fbc10adba9e5cf49b7c65c5873aeb714aa40cc1cfdce6fa
      TZ_ANDROID_CERT_SHA256: F7:7C:34:D2:85:28:09:74:BA:8D:19:55:F2:BB:94:74:3A:0A:AC:24:61:6D:97:DF:8B:A6:09:43:78:E0:11:16

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TZ_ANDROID_API_ID" || { echo "TZ_ANDROID_API_ID is missing"; exit 1; }
          test -n "$TZ_ANDROID_API_HASH" || { echo "TZ_ANDROID_API_HASH is missing"; exit 1; }
          test -n "$TZ_ANDROID_KEYSTORE_BASE64" || { echo "TZ_ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$TZ_ANDROID_KEYSTORE_PASSWORD" || { echo "TZ_ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$TZ_ANDROID_KEY_ALIAS" || { echo "TZ_ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$TZ_ANDROID_KEY_PASSWORD" || { echo "TZ_ANDROID_KEY_PASSWORD is missing"; exit 1; }
          test -n "$TZ_ANDROID_GOOGLE_SERVICES_JSON_BASE64" || { echo "TZ_ANDROID_GOOGLE_SERVICES_JSON_BASE64 is missing"; exit 1; }
          echo "::add-mask::$TZ_ANDROID_API_ID"
          echo "::add-mask::$TZ_ANDROID_API_HASH"
          echo "::add-mask::$TZ_ANDROID_KEYSTORE_BASE64"
          echo "::add-mask::$TZ_ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$TZ_ANDROID_KEY_ALIAS"
          echo "::add-mask::$TZ_ANDROID_KEY_PASSWORD"
          echo "::add-mask::$TZ_ANDROID_GOOGLE_SERVICES_JSON_BASE64"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore and verify private release signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="TMessagesProj/config/release.keystore"
          printf '%s' "$TZ_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "$TZ_ANDROID_KEYSTORE_SHA256  $keystore" | sha256sum --check --strict
          cert_sha256="$(keytool -list -v \
            -keystore "$keystore" \
            -storepass "$TZ_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$TZ_ANDROID_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p')"
          test "$cert_sha256" = "$TZ_ANDROID_CERT_SHA256" || {
            echo "Unexpected Android signing certificate fingerprint"
            exit 1
          }

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Verify pinned TZ source configuration
        run: python3 scripts/tz_android_verify_source.py

      - name: Render private API credentials
        run: python3 scripts/tz_android_render_build_vars.py

      - name: Render and verify private Firebase client configuration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TZ_ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > TMessagesProj/google-services.json
          cp TMessagesProj/google-services.json TMessagesProj_AppStandalone/google-services.json
          python3 - <<'PY'
          import json
          for path in ("TMessagesProj/google-services.json", "TMessagesProj_AppStandalone/google-services.json"):
              data = json.load(open(path, encoding="utf-8"))
              packages = {
                  client["client_info"]["android_client_info"]["package_name"]
                  for client in data.get("client", [])
              }
              if "com.tianze.tz" not in packages:
                  raise SystemExit(f"{path} does not contain com.tianze.tz")
          PY
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:processAfatStandaloneMainManifest \
            -PTZ_GOOGLE_PUSH=true \
            --no-daemon \
            --stacktrace

      - name: Verify no-Google manifest before native compilation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:processAfatStandaloneMainManifest \
            -PTZ_NO_GOOGLE=true \
            --no-daemon \
            --stacktrace

      - name: Build no-Google release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -PTZ_NO_GOOGLE=true \
            -PRELEASE_STORE_PASSWORD="$TZ_ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$TZ_ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$TZ_ANDROID_KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

      - name: Collect no-Google APK
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tz-android-apk"
          mkdir -p "$output"
          apk="$(find TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "$output/TZ-Android-1.0.10-no-google.apk"

      - name: Build FCM release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj_AppStandalone:processAfatStandaloneMainManifest \
            -PTZ_GOOGLE_PUSH=true \
            --no-daemon \
            --stacktrace
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -PTZ_GOOGLE_PUSH=true \
            -PRELEASE_STORE_PASSWORD="$TZ_ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$TZ_ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$TZ_ANDROID_KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

      - name: Collect FCM APK and provenance
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tz-android-apk"
          apk="$(find TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "$output/TZ-Android-1.0.10-fcm.apk"
          unzip -p "$apk" 'lib/*/libtmessages*.so' | strings > "$RUNNER_TEMP/tz-native-strings.txt"
          grep -Fq 'tztg.tianze8.cc' "$RUNNER_TEMP/tz-native-strings.txt"
          grep -Fq 'MIIBCgKCAQEA7lyx4eQO/cyY9icmLgUQ2nxZ++xP+q1AQEfCRSvilbS72Qvyj/dJ' "$RUNNER_TEMP/tz-native-strings.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$apk" | tee "$RUNNER_TEMP/tz-apk-signature.txt"
          grep -Fqi "Signer #1 certificate SHA-256 digest: ${TZ_ANDROID_CERT_SHA256//:/}" "$RUNNER_TEMP/tz-apk-signature.txt"
          cp TZ_ANDROID_UPSTREAM.lock "$output/"
          (cd "$output" && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TZ-Android-1.0.10-dual
          path: ${{ runner.temp }}/tz-android-apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/tz-android-apk/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TZ Android 1.0.10" \
            --notes "TZ Android 1.0.10：修复无 Google 与 FCM 双构建的 Manifest 合并配置，分别使用确定的 Google 组件移除/保留清单，不再依赖未展开的 tools:node 占位符；继续提供私有签名的 no-google 与 FCM 两个 Full LTO APK。保留生产 DC2、gramsrv RSA、TL Layer 228、密码登录、简体中文默认语言及 tg.tianze8.cc App Links。客户端可见的旧 Telesrv 品牌文字由 TZ Server 1.0.7 语言包统一刷新。"
