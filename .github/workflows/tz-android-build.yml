name: TZ Android APK candidate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/bootstrap-tz-android

permissions:
  contents: read

concurrency:
  group: tz-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ_ANDROID_API_ID: ${{ secrets.TZ_ANDROID_API_ID }}
      TZ_ANDROID_API_HASH: ${{ secrets.TZ_ANDROID_API_HASH }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TZ_ANDROID_API_ID" || { echo "TZ_ANDROID_API_ID is missing"; exit 1; }
          test -n "$TZ_ANDROID_API_HASH" || { echo "TZ_ANDROID_API_HASH is missing"; exit 1; }
          echo "::add-mask::$TZ_ANDROID_API_ID"
          echo "::add-mask::$TZ_ANDROID_API_HASH"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Verify pinned TZ source configuration
        run: python3 scripts/tz_android_verify_source.py

      - name: Render private API credentials
        run: python3 scripts/tz_android_render_build_vars.py

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APK and provenance
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tz-android-apk"
          mkdir -p "$output"
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -exec cp {} "$output/" \;
          test -n "$(find "$output" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cp TZ_ANDROID_UPSTREAM.lock "$output/"
          (cd "$output" && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TZ-Android-1.0.0-debug
          path: ${{ runner.temp }}/tz-android-apk
          if-no-files-found: error
          retention-days: 14
